quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${HEVYFIT_DB_USER}
quarkus.datasource.password=${HEVYFIT_DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/hevyfit_measurements

quarkus.hibernate-orm.schema-management.strategy=update

quarkus.index-dependency.hevyfit-common.group-id=com.hevyfit
quarkus.index-dependency.hevyfit-common.artifact-id=hevyfit-common

quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${HEVYFIT_CORS_ORIGINS:http://localhost:5173}

quarkus.management.enabled=true
quarkus.management.port=9090
